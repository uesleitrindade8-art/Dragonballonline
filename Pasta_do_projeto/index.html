<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena Tenkaichi</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div id="app">
        <!-- Tela Inicial -->
        <section id="tela-inicial" class="tela ativa">
            <h1>ARENA TENKAICHI</h1>
                <div class="menu-botoes">
                <button id="btn-criar-sala">Criar Sala</button>
                <input type="text" id="input-codigo-sala" placeholder="Código da Sala" maxlength="9">
                <button id="btn-entrar-sala">Entrar na Sala</button>
                <button id="btn-lutar-bot" style="background: #7f8c8d; color: white; margin-top: 10px;">Lutar contra Bot (Teste)</button>
            <label style="margin-top: 10px; color: #aaa; font-size: 0.9rem; display: flex; align-items: center; gap: 5px; justify-content: center;"><input type="checkbox" id="chk-bot-passivo" style="width: auto; padding: 0;"> Bot Passivo (Só Carrega Ki)</label>
            </div>
            <div id="status-sala"></div>
        </section>

        <!-- Tela de Seleção (apenas placeholder por enquanto) -->
        <section id="tela-selecao" class="tela">
            <h2>Escolha seu Guerreiro</h2>
            <div id="lista-personagens"></div>
        </section>

        <!-- Tela de Batalha -->
        <section id="tela-batalha" class="tela">
            <div class="arena-combate">
                <!-- Status dos Jogadores -->
                <div class="combatentes">
                    <div id="info-jogador" class="info-personagem"></div>
                    <div id="info-oponente" class="info-personagem"></div>
                </div>
                
                <!-- Área da Narração -->
                <div id="area-gifs" class="area-gifs">
                    <span id="texto-narracao">A luta vai começar!</span>
                </div>

                <!-- Log de Narração -->
                <div id="log-narracao" class="log-narracao">
                    <p>A luta vai começar!</p>
                </div>

                <!-- Menu de Ações (botões dos golpes) -->
                <div id="menu-acoes" class="menu-acoes"></div>
            </div>
        </section>

        <!-- Tela de Fim de Jogo -->
        <section id="tela-fim-jogo" class="tela">
            <h1 id="titulo-fim">FIM DE JOGO</h1>
            <div id="resumo-arena"></div>
            <button id="btn-revanche">REMATCH 🔁</button>
            <button id="btn-ver-log" style="background: transparent; border: 1px solid #3498db; color: #3498db; margin-top: 10px; font-size: 1rem; padding: 10px 20px;">Ver Log da Batalha 📜</button>
            <button id="btn-menu-inicial" style="background: transparent; border: 1px solid #ffcc00; color: #ffcc00; margin-top: 10px; font-size: 1rem; padding: 10px 20px;">Voltar ao Menu</button>
        </section>
        <div id="modal-log" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10; flex-direction: column; padding: 20px; box-sizing: border-box; overflow-y: auto;">
            <h2 style="color: #ffcc00; margin-bottom: 20px;">Log da Batalha</h2>
            <div id="log-completo-fim" style="background: #222; padding: 15px; border-radius: 8px; flex: 1; overflow-y: auto; font-size: 0.9rem; color: #ccc; border: 1px solid #555;"></div>
            <button id="btn-fechar-log" style="margin-top: 15px; background: #e74c3c; color: white; padding: 10px 20px;">Fechar</button>
        </div>
    </div>

    <!-- SDK do Firebase via CDN (Conforme GDD) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- Scripts do Jogo (usando type=module para import/export locais) -->
    <script type="module" src="js/data.js"></script>
    <script type="module" src="js/engine.js"></script>
    <script type="module" src="js/ui.js"></script>
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
